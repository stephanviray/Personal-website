      if (node.type === 'dir') {
        for (let key in node.children) {
          flattenFiles(node.children[key]);
        }

        if (node.type === 'image' || node.type === 'video') {
          GALLERY_ITEMS.push(node);

      let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
      handle.addEventListener('mousedown', (e) => {
        if (win.classList.contains('window-maximized')) return;
        dragging = true; sx = e.clientX; sy = e.clientY;
        const r = win.getBoundingClientRect(); ox = r.left; oy = r.top;
        e.preventDefault();
      });
      window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        win.style.left = Math.max(0, ox + (e.clientX - sx)) + 'px';
        win.style.top = Math.max(0, oy + (e.clientY - sy)) + 'px';
      });
      window.addEventListener('mouseup', () => dragging = false);
    }

    /* ---------- Start menu ---------- */
    const smLeft = document.getElementById('sm-left');
    const startMenuItem = (label, color, onOpen) => {
      const el = document.createElement('div');
      el.className = 'sm-item';
      el.innerHTML = `<span class="ic" style="background:${color}"></span> ${label}`;
      el.addEventListener('click', () => { onOpen(); document.getElementById('start-menu').classList.remove('show'); });
      return el;
    };
    smLeft.appendChild(startMenuItem('My Computer', '#dfe6f0', openExplorer));
    smLeft.appendChild(startMenuItem('Photo Viewer', '#c6ff5e', () => {
      const imageItems = GALLERY_ITEMS.filter(i => i.type === 'image');
      openGalleryViewer(imageItems, 0);
    }));
    smLeft.appendChild(startMenuItem('Video Work', '#7ea8ff', () => openVideoViewer(0)));

    const startBtn = document.getElementById('start-btn');
    const startMenu = document.getElementById('start-menu');
    startBtn.addEventListener('click', (e) => { startMenu.classList.toggle('show'); e.stopPropagation(); });
    document.addEventListener('click', (e) => {
      if (!startMenu.contains(e.target) && e.target !== startBtn) startMenu.classList.remove('show');
    });
    startMenu.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', () => { openInfoViewer(SYSTEM_APPS[el.dataset.open]); startMenu.classList.remove('show'); });
    });

    document.getElementById('shutdown-btn').addEventListener('click', () => {
      startMenu.classList.remove('show');
      const boot = document.getElementById('boot');
      boot.style.display = 'flex'; boot.style.opacity = '1';
      setTimeout(() => { boot.style.opacity = '0'; setTimeout(() => boot.style.display = 'none', 600); }, 1400);
    });

    function tick() {
      const d = new Date();
      let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
      const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12; if (h === 0) h = 12;
      document.getElementById('clock').textContent = `${h}:${m} ${ap}`;
    }
    tick(); setInterval(tick, 15000);

    window.addEventListener('load', () => {
      setTimeout(() => {
        const boot = document.getElementById('boot');
        boot.style.opacity = '0';
        setTimeout(() => {
          boot.style.display = 'none';
          openExplorer();
          openPortfolioGrid();
          openInfoViewer(SYSTEM_APPS.about);
          if (openMap.about) {
            openMap.about.style.left = '34px';
            openMap.about.style.top = '42px';
          }
        }, 600);
      }, 1500);
    });
  </script>

</body>

</html>
